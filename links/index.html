<style>
:root{
  --dark:#2A2019; --deep:#1F1711; --raise:#35281F;
  --gold:#B89A6A; --ink:#F2EBDF; --ink-2:rgba(242,235,223,.66); --line:rgba(242,235,223,.16);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--deep);color:var(--ink);
  font-family:"Noto Sans TC",system-ui,sans-serif;font-weight:300;font-size:14.5px;line-height:1.8;letter-spacing:.03em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
img{display:block;width:100%;height:100%;object-fit:cover}
.en{font-family:Jost,"Noto Sans TC",sans-serif;font-weight:300;text-transform:uppercase;letter-spacing:.3em}

/* 整頁是一欄，桌機上置中成手機寬度 */
.page{max-width:480px;margin:0 auto;min-height:100dvh;background:
  radial-gradient(120% 60% at 10% 38%,rgba(122,92,68,.30),transparent 62%),
  linear-gradient(170deg,var(--raise) 0%,var(--dark) 46%,var(--deep) 100%)}

/* 首屏：人像照往下淡入深色，品牌名壓在照片下緣 */
.hero{position:relative;aspect-ratio:4/4.6;overflow:hidden}
.hero img{object-position:50% 18%}
.hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(31,23,17,.10) 0%,rgba(31,23,17,0) 34%,rgba(42,32,25,.78) 76%,var(--dark) 100%)}
.hero-text{position:absolute;left:24px;right:24px;bottom:22px;z-index:1}
.hero-text .en{font-size:10.5px;color:var(--gold);display:block;margin-bottom:10px}
h1{font-weight:200;font-size:34px;line-height:1.25;letter-spacing:.14em}
.hero-text p{margin-top:10px;color:var(--ink-2);font-size:13px}

main{padding:22px 16px 8px;display:grid;gap:10px}

/* 主要連結：一張大卡加兩張半寬卡 */
.card{position:relative;display:block;overflow:hidden;background:var(--raise);
  transition:transform .5s var(--ease)}
.card:active{transform:scale(.985)}
.card .pic{position:absolute;inset:0}
.card .pic img{transition:transform 1.2s var(--ease)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(31,23,17,.06) 0%,rgba(31,23,17,.34) 44%,rgba(31,23,17,.90) 100%)}
.card .tx{position:absolute;left:18px;right:18px;bottom:16px;z-index:1}
.card h2{font-weight:300;font-size:19px;letter-spacing:.1em;line-height:1.4}
.card p{color:var(--ink-2);font-size:12.5px;margin-top:2px}
.card .go{position:absolute;top:14px;right:14px;z-index:1;width:34px;height:34px;display:grid;place-items:center;
  border:1px solid rgba(242,235,223,.42);font-size:16px;background:rgba(31,23,17,.28);
  transition:background .4s var(--ease),color .4s var(--ease)}
.card.big{aspect-ratio:16/10.5}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .card{aspect-ratio:1/1.16}
/* 沒有照片的卡：用金色細線與光暈做出質感 */
.card.plain{background:
  radial-gradient(90% 70% at 100% 0%,rgba(184,154,106,.26),transparent 62%),
  linear-gradient(160deg,#3B2D23 0%,#2A2019 60%,#231A14 100%)}
.card.plain::after{background:none;inset:9px;border:1px solid rgba(184,154,106,.34)}
.card.plain .mark{position:absolute;left:18px;top:16px;font-size:10px;color:var(--gold);z-index:1}

/* 次要連結：細線分隔的列 */
.rows{margin-top:14px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid var(--line);
  transition:padding .5s var(--ease),color .3s}
.row i:first-child{font-size:19px;color:var(--gold)}
.row b{font-weight:300;font-size:14.5px;letter-spacing:.06em;display:block;line-height:1.5}
.row span{color:var(--ink-2);font-size:12px;display:block;line-height:1.5}
.row .arr{font-size:15px;color:var(--ink-2);transition:transform .5s var(--ease)}
.row:active{padding-left:10px}

footer{padding:26px 20px calc(30px + env(safe-area-inset-bottom));text-align:center;color:var(--ink-2);font-size:12px;line-height:2}
footer .en{font-size:9.5px;color:var(--gold);display:block;margin-bottom:6px}

@media (hover:hover){
  .card:hover .pic img{transform:scale(1.045)}
  .card:hover .go{background:var(--ink);color:var(--dark)}
  .row:hover{padding-left:10px}
  .row:hover .arr{transform:translate(3px,-3px)}
}
a:focus-visible{outline:1px solid var(--gold);outline-offset:3px}

/* 進場：由上而下依序浮現，讓視線先落在照片再到預約 */
@media (prefers-reduced-motion:no-preference){
  .rise{opacity:0;transform:translateY(16px);animation:rise .9s var(--ease) forwards;animation-delay:calc(var(--i)*90ms + 120ms)}
  .hero img{animation:settle 1.6s var(--ease) both}
  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes settle{from{transform:scale(1.06)}to{transform:none}}
}
</style>
</head>
<body>
<div class="page">

  <header class="hero">
    <img src="../assets/img/links/hero.jpg" alt="肌·癒皮膚管理中心店內，Becky 站在品牌標誌牆前" width="1080" height="1274" fetchpriority="high">
    <div class="hero-text">

  <main>

        <div class="pic"><img src="../assets/img/links/teach.jpg" alt="Becky 在店內授課" loading="lazy" width="720" height="648"></div>

      <a class="card plain rise" style="--i:5" href="https://lin.ee/jVCKoTC" target="_blank" rel="noopener">

        <span class="go"><i class="ph-light ph-arrow-up-right" aria-hidden="true"></i></span>
        <div class="tx"><h2>醫美諮詢</h2><p>LINE 專人回覆</p></div>
      </a>
    </div>

    <nav class="rows" aria-label="其他連結">
      <a class="row rise" style="--i:6" href="https://jiyu-skincare.github.io/">
        <i class="ph-light ph-browser" aria-hidden="true"></i>
        <div><b>官方網站</b><span>課程介紹與常見問題</span></div>
        <i class="ph-light ph-arrow-up-right arr" aria-hidden="true"></i>
      </a>
      <a class="row rise" style="--i:7" href="https://maps.app.goo.gl/JAcLngXrUneg1AyRA" target="_blank" rel="noopener">
        <i class="ph-light ph-map-pin" aria-hidden="true"></i>
        <div><b>交通資訊</b><span>捷運中山站步行五分鐘，以 Google 地圖開啟</span></div>
        <i class="ph-light ph-arrow-up-right arr" aria-hidden="true"></i>

      <a class="row rise" style="--i:8" href="https://www.instagram.com/jiyu.tw/" target="_blank" rel="noopener">
        <i class="ph-light ph-instagram-logo" aria-hidden="true"></i>
        <div><b>Instagram</b><span>@jiyu.tw</span></div>
        <i class="ph-light ph-arrow-up-right arr" aria-hidden="true"></i>
      </a>
    </nav>
  </main>

  <footer class="rise" style="--i:9">
    每日 12:00 至 22:00<br>
    肌·癒皮膚管理中心
  </footer>

</div>
</body>
</html>
